# 银河麒麟报告 FTP 接收端非敏感配置
#
# 基本写法：
# 1. 每个参数单独占一行，格式为 参数名=参数值。
# 2. 只修改等号右侧的参数值，不要修改参数名。
# 3. 参数值不要加单引号或双引号，行尾也不要追加说明文字。
# 4. 账号和密码不得写入本文件，启动接收端时会临时询问。
# 5. 修改完成后保存文件，再双击 Start-FTP-Receiver.cmd。

# PASSIVE_IP：麒麟终端能够访问到的接收电脑 IPv4 地址。
# 必须是接收电脑网卡上实际配置的IPv4，不能填写麒麟客户端的地址。
# 正确示例：PASSIVE_IP=192.0.2.10
# 家用或测试网络示例：PASSIVE_IP=192.168.1.10
# 错误示例：PASSIVE_IP=0.0.0.0
# 错误示例：PASSIVE_IP=192.0.2.10/24
# 错误示例：PASSIVE_IP=http://192.0.2.10
PASSIVE_IP=192.0.2.10

# CONTROL_PORT：FTP控制连接监听端口，取值范围为1到65535。
# 麒麟客户端配置的FTP端口必须与这里完全一致。
# 正确示例：CONTROL_PORT=13331
# 如果端口被其他程序占用，可以改为其他未占用端口，例如：CONTROL_PORT=13332
# 错误示例：CONTROL_PORT=0
# 错误示例：CONTROL_PORT=70000
# 错误示例：CONTROL_PORT=13331,13332
CONTROL_PORT=13331

# PASSIVE_PORT_START、PASSIVE_PORT_END：FTP被动模式的数据传输端口范围。
# 起始值和结束值都必须是1到65535之间的整数，结束值不能小于起始值。
# 建议连续保留10个端口；启动脚本会为整个范围创建入站防火墙规则。
# 正确示例：
# PASSIVE_PORT_START=30000
# PASSIVE_PORT_END=30009
# 另一组正确示例：
# PASSIVE_PORT_START=31000
# PASSIVE_PORT_END=31009
# 错误示例：起始值为30010、结束值为30000。
# 麒麟客户端不需要单独填写这两个端口，由FTP协议自动协商。
PASSIVE_PORT_START=30000
PASSIVE_PORT_END=30009

# ALLOWED_REMOTE：允许向本接收端回传报告的麒麟终端IPv4或IPv4网段。
# 单台终端可以直接填写IPv4：
# ALLOWED_REMOTE=192.0.2.117
# 单个网段示例：
# ALLOWED_REMOTE=192.0.2.0/24
# 多个终端或网段可用英文逗号、中文逗号、分号或空格分隔：
# ALLOWED_REMOTE=192.0.2.0/24,198.51.100.0/24,203.0.113.15
# 也可以混合单台终端和网段：
# ALLOWED_REMOTE=192.0.2.117,198.51.100.0/24
# 不建议使用ALLOWED_REMOTE=0.0.0.0/0，因为这会允许所有来源访问FTP端口。
# 错误示例：ALLOWED_REMOTE=192.0.2
# 错误示例：ALLOWED_REMOTE=192.0.2.0/33
ALLOWED_REMOTE=192.0.2.0/24,198.51.100.0/24

# REPORT_DIRECTORY：接收到的HTML和JSON报告保存目录。
# 相对路径以当前接收端目录为基准：
# REPORT_DIRECTORY=reports
# 上面的写法会保存到“接收端\reports”目录。
# 也可以填写Windows绝对路径：
# REPORT_DIRECTORY=D:\FTP-Reports
# 带空格的路径也不要加引号，例如：
# REPORT_DIRECTORY=D:\终端检查报告\麒麟报告
# 启动账号必须对该目录拥有创建文件和写入权限。
REPORT_DIRECTORY=reports
